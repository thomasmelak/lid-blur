name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app (universal)
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Check bundle
        run: |
          lipo -info "build/Lid Blur.app/Contents/MacOS/LidBlur"
          plutil -lint "build/Lid Blur.app/Contents/Info.plist"
          codesign --verify --verbose "build/Lid Blur.app"
      - name: Check scripts
        run: |
          for f in install.sh uninstall.sh scripts/build-app.sh; do bash -n "$f"; done
          ruby -c Casks/lid-blur.rb
      - uses: actions/upload-artifact@v4
        with:
          name: LidBlur
          path: build/LidBlur.zip
