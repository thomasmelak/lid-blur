name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Signing certificate
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: scripts/import-signing-cert.sh
      - name: Build app (universal)
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Build DMG
        run: scripts/build-dmg.sh
      - name: Check bundle
        run: |
          lipo -info "build/Lid Blur.app/Contents/MacOS/LidBlur"
          plutil -lint "build/Lid Blur.app/Contents/Info.plist"
          codesign --verify --verbose "build/Lid Blur.app"
          hdiutil verify build/LidBlur.dmg
          test -s "build/Lid Blur.app/Contents/Resources/AppIcon.icns"
      - name: Check scripts
        run: |
          for f in install.sh uninstall.sh scripts/*.sh; do bash -n "$f"; done
          ruby -c Casks/lid-blur.rb
      - uses: actions/upload-artifact@v4
        with:
          name: LidBlur
          path: |
            build/LidBlur.zip
            build/LidBlur.dmg
