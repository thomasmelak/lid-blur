name: Release

# Publishes LidBlur.zip (used by Homebrew and install.sh) and LidBlur.dmg (drag to install)
# to a GitHub release. Trigger it by pushing a tag like v0.1.0, or run it by hand from the
# Actions tab with a tag name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-15-intel
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app (universal)
        run: UNIVERSAL=1 VERSION="$TAG" scripts/build-app.sh
      - name: Build DMG
        run: scripts/build-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/LidBlur.zip build/LidBlur.dmg \
            --target "$GITHUB_SHA" \
            --title "Lid Blur $TAG" \
            --generate-notes

      # Point the cask at this release so `brew upgrade` picks it up. main only
      # takes changes through pull requests, so open one with the bump.
      - name: Open cask bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 build/LidBlur.zip | cut -d' ' -f1)"
          BRANCH="cask/lid-blur-$VERSION"
          git fetch --depth 1 origin main
          git checkout -B "$BRANCH" FETCH_HEAD
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" \
            -e "s#releases/download/[^/]+/#releases/download/$TAG/#" \
            Casks/lid-blur.rb
          if git diff --quiet; then
            echo "Cask already at $VERSION"
            exit 0
          fi
          git config user.name "$OWNER"
          git config user.email "${OWNER_ID}+${OWNER}@users.noreply.github.com"
          git commit -am "Update cask to $VERSION"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Update cask to $VERSION" \
            --body "Points Casks/lid-blur.rb at the $TAG release (sha256 $SHA) so \`brew upgrade\` offers it."
