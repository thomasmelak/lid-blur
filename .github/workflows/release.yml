name: Release

# Publishes LidBlur.zip (used by Homebrew and install.sh) and LidBlur.dmg (drag to install)
# to a GitHub release. Trigger it by pushing a tag like v0.1.0, or run it by hand from the
# Actions tab with a tag name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Signing certificate
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: scripts/import-signing-cert.sh
      - name: Build app (universal)
        run: UNIVERSAL=1 VERSION="$TAG" scripts/build-app.sh
      - name: Build DMG
        run: scripts/build-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" build/LidBlur.zip build/LidBlur.dmg \
            --target "$GITHUB_SHA" \
            --title "Lid Blur $TAG" \
            --generate-notes
