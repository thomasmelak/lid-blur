name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build app (universal)
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME}" scripts/build-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/LidBlur.zip --title "Lid Blur $GITHUB_REF_NAME" --generate-notes
