<!doctype html><html><head><style>
html,body{margin:0;background:transparent}
.canvas{width:1024px;height:1024px;position:relative}
.body{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:186px;
 background:radial-gradient(120% 90% at 30% 10%,#3a2f7a 0%,#17143a 45%,#07060f 100%);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.18), inset 0 -10px 30px rgba(0,0,0,.5), 0 18px 40px rgba(0,0,0,.35);
 overflow:hidden}
.glow{position:absolute;left:162px;top:470px;width:500px;height:300px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(255,140,90,.35),transparent);filter:blur(30px)}
.lid{position:absolute;left:142px;top:178px;width:540px;height:372px;border-radius:30px;
 background:#0c0c14;box-shadow:0 0 0 3px #3c3d48, 0 20px 50px rgba(0,0,0,.55)}
.screen{position:absolute;left:16px;top:16px;right:16px;bottom:16px;border-radius:16px;overflow:hidden;
 background:
  radial-gradient(60% 70% at 18% 85%,#ff6a3d 0%,transparent 60%),
  radial-gradient(55% 65% at 80% 80%,#ff2e88 0%,transparent 60%),
  radial-gradient(70% 70% at 55% 25%,#3d7bff 0%,transparent 65%),
  radial-gradient(50% 50% at 15% 20%,#22e0c8 0%,transparent 60%),
  linear-gradient(180deg,#1a1450,#2a0f3a)}
.dots{position:absolute;left:44px;right:44px;bottom:40px;display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.dots i{display:block;height:52px;border-radius:14px;background:rgba(255,255,255,.85);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.dots i:nth-child(2n){background:rgba(255,255,255,.55)}
.bar{position:absolute;left:44px;top:46px;width:200px;height:26px;border-radius:13px;background:rgba(255,255,255,.8)}
.bar2{position:absolute;left:44px;top:90px;width:300px;height:110px;border-radius:24px;background:rgba(255,255,255,.35)}
.frost{position:absolute;inset:0;backdrop-filter:blur(34px) saturate(1.3) brightness(.9);
 -webkit-backdrop-filter:blur(34px) saturate(1.3) brightness(.9);
 -webkit-mask-image:linear-gradient(to top,transparent 0%,transparent 28%,#000 62%,#000 100%);
 mask-image:linear-gradient(to top,transparent 0%,transparent 28%,#000 62%,#000 100%)}
.sheen{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 40%)}
.base{position:absolute;left:96px;top:556px;width:632px;height:30px;border-radius:4px 4px 26px 26px;
 background:linear-gradient(180deg,#e9eaf0,#a6a8b4 70%,#6f717c);box-shadow:0 14px 30px rgba(0,0,0,.5)}
.notch{position:absolute;left:50%;top:0;width:110px;height:10px;margin-left:-55px;border-radius:0 0 10px 10px;background:#8c8e99}
</style></head><body><div class="canvas"><div class="body">
<div class="glow"></div>
<div class="lid"><div class="screen">
 <div class="bar"></div><div class="bar2"></div>
 <div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
 <div class="frost"></div><div class="sheen"></div>
</div></div>
<div class="base"><div class="notch"></div></div>
</div></div></body></html>
